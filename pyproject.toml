[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theweb"
version = "0.1.0"
description = "Numerical investigations of the Web Hypothesis: one structure setting both distance and entanglement."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "networkx", "matplotlib"]

[project.optional-dependencies]
sdp = ["cvxpy"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
